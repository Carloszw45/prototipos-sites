<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0907">
<title>Senhor Burger — carregando v0.5</title>
<style>html,body{margin:0;min-height:100%;background:#0c0907;color:#efe3d2;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center}.loading{font-size:10px;letter-spacing:.18em;opacity:.55}</style>
</head>
<body>
<div class="loading">CARREGANDO PROTÓTIPO…</div>
<script>
(async()=>{
  try{
    const res=await fetch('./v3base.html?v=05',{cache:'no-store'});
    if(!res.ok) throw new Error('base');
    let html=await res.text();
    html=html.replace('</body>','<script src="./transitions-v05.js?v=05"><\\/script></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading">NÃO FOI POSSÍVEL CARREGAR O PROTÓTIPO.</div>';
  }
})();
</script>
</body>
</html>
